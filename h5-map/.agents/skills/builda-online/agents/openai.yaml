interface:
  display_name: "Builda Online Multiplayer Development"
  short_description: "For Godot, H5, Cocos, or Unity: confirm the plan first, then build Builda hosted multiplayer"
  default_prompt: "Use $builda-online to implement hosted multiplayer for the current Godot, H5, Cocos, or Unity Builda game. First do a read-only inventory of public capabilities and project evidence; when asking about the plan, first give examples from common patterns such as Honor of Kings/LOL normal matchmaking, CF/CS looping rooms, MMO/Minecraft persistent worlds and explain the full flow, without requiring me to understand Room, Pool, drop-in/drop-out, or Confirm; if still ambiguous, then ask about concrete player timing. After confirming the client engine, TypeScript/Rust Room language, public automatic matchmaking, multiple matchKeys, player flow, trust model, and tampering risk, proactively keep builda.online.json, the current-language Room source, the single client, the message protocol, and the local Scenario in sync; release the online Room only when I explicitly ask to deploy or go live."
